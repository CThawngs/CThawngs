name: Build profile

on:
  push:
    branches: [main]
    paths: ["profile.json", "README.tpl.md", "build.py", "data/portrait.txt"]
  schedule:
    - cron: "17 6 * * *"      # daily 06:17 UTC: refresh heatmap + repo cards
  workflow_dispatch:           # Actions tab -> Run workflow

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build README + assets from profile.json
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push (rebase + retry if main moved while building)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: rebuild profile [skip ci]"
          for attempt in 1 2 3 4 5; do
            # during a rebase, "theirs" is our freshly generated commit, so generated files win
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
