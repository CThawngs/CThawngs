name: Build profile

on:
  push:
    branches: [main]
    paths: ["profile.json", "README.tpl.md", "build.py", "data/portrait.txt"]
  schedule:
    - cron: "17 6 * * *"      # daily 06:17 UTC: refresh heatmap + repo cards
  workflow_dispatch:           # Actions tab -> Run workflow

permissions:
  contents: write

concurrency:
  group: build-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build README + assets from profile.json
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild profile [skip ci]"
          file_pattern: "README.md assets data"
