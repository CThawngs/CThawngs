name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"      # every day, 06:17 UTC
  workflow_dispatch:           # Actions tab -> Run workflow
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/profile.json"

permissions:
  contents: write

# Serialize runs: a push-triggered run and a manual dispatch would otherwise
# both commit and race, causing a non-fast-forward rejection.
concurrency:
  group: update-profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
        env:
          GITHUB_USER: CThawngs
      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py
      # Project cards need the heavy image stack; skip them on CI so the daily
      # run stays cheap. Descriptions come from the API, so the README grid
      # stays accurate even between asset rebuilds.
      - name: Refresh repo metadata
        run: python scripts/fetch_repos.py
        env:
          GITHUB_USER: CThawngs
      - name: Rebuild README
        run: python scripts/make_readme.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile data [skip ci]"
          file_pattern: "data/contributions.json data/repos.json assets/contrib-heatmap.svg README.md"
