ext x="76" y="122" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">(auto-generating projects, tasks, specs, and weekly reports).</text><text x="62" y="140" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#2dd4bf">•</text><text x="76" y="140" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">Built an MCP tool for AI-powered disk cleanup.</text><text x="62" y="158" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#2dd4bf">•</text><text x="76" y="158" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">Formed a team to compete in the AI Riser Vietnam 2026 (Google Hackathon) and ranked among the top 200 teams in</text><text x="76" y="176" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">Vietnam.</text><circle cx="22" cy="230" r="6" fill="#0b1020" stroke="#2dd4bf" stroke-width="2"><animate attributeName="r" values="6;8;6" dur="3.2s" begin="0.4s" repeatCount="indefinite"/></circle><rect x="46" y="208" width="812" height="180" rx="10" fill="#0b1020" stroke="#30363d"/><rect x="46" y="218" width="3" height="160" rx="1.5" fill="#2dd4bf"/><text x="62" y="235" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Google Student Ambassador Trainer <tspan fill="#2dd4bf">· Google</tspan></text><text x="840" y="235" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#8b949e">2/2026 – 6/2026</text><text x="62" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#2dd4bf">•</text><text x="76" y="260" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">Spearheaded GenAI workshops across HCMC universities, delivering Prompt Engineering training and driving AI</text><text x="76" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">adoption for 500+ diverse students.</text><text x="62" y="296" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#2dd4bf">•</text><text x="76" y="296" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">Designed and configured specialized AI Agents to automate tasks and optimize workflows for end-users.</text><text x="62" y="314" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#2dd4bf">•</text><text x="76" y="314" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">Deployed n8n automation workflows for email systems while processing and managing operational datasets for 500+</text><text x="76" y="332" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">participants.</text><text x="62" y="350" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#2dd4bf">•</text><text x="76" y="350" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">Collaborated via Google Workspace/Office 365 and integrated AI tools to automate reporting, significantly</text><text x="76" y="368" font-family="-apple-system,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif" font-size="12.5" fill="#8b949e">accelerating project delivery.</text><circle cx="22" cy="422" r="6" fill="#0b1020" stroke="#2dd4bf" stroke-width="2"><animate attributeName="r" values="6;8;6" dur="3.2s" begin="0.8s" repeatCount="indefinite"/><